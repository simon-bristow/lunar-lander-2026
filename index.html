<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Lunar Lander 2026</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    /* Scale canvas to fill the viewport while preserving 3:2 ratio (900×600) */
    canvas {
      display: block;
      width:  min(100vw, 150vh, 900px);
      height: min(100vh, 66.6667vw, 600px);
    }
    #controls {
      margin-top: 10px;
      color: #444;
      font: 12px monospace;
      text-align: center;
      letter-spacing: 0.03em;
    }
    /* Portrait-mode warning — shown on mobile only via JS class */
    #portrait-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #111;
      color: #fff;
      font: bold 20px monospace;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      z-index: 1001;
    }
    #portrait-overlay p { margin-top: 16px; font: 14px monospace; color: #888; font-weight: normal; }
    @media (orientation: portrait) {
      body.mobile #portrait-overlay { display: flex; }
    }
    #android-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #111;
      color: #fff;
      font: bold 20px monospace;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      z-index: 999;
    }
    #android-overlay p { margin-top: 16px; font-size: 14px; color: #888; font-weight: normal; }
  </style>
</head>
<body>
<div id="portrait-overlay">
  ↺ Please rotate your device
  <p>Lunar Lander 2026 must be played in landscape mode.</p>
</div>
<div id="android-overlay">

// Saves made before the cave levels existed used ids 1–12. Shift them
// to the new 16-level numbering once (old id n → n + floor((n-1)/3)).
(function migrateSaves() {
  try {
    if (localStorage.getItem('ll_layout') === '16') return;
    for (let n = 12; n >= 1; n--) {
      const m = n + Math.floor((n - 1) / 3);
      for (const k of ['stars', 'fuel']) {
        const v = localStorage.getItem(`ll_${n}_${k}`);
        localStorage.removeItem(`ll_${n}_${k}`);
        if (v !== null) localStorage.setItem(`ll_${m}_${k}`, v);
      }
    }
    localStorage.setItem('ll_layout', '16');
  } catch (e) { /* storage unavailable — nothing to migrate */ }
})();

// localStorage helpers  (SPEC-10 §5, SPEC-11 §6)
function savedStars(id)    { return parseInt(localStorage.getItem(`ll_${id}_stars`)  || '0'); }
function savedFuel(id)     { return parseFloat(localStorage.getItem(`ll_${id}_fuel`) || '0'); }
function saveProgress(id, stars, fuelPct) {
  if (stars   > savedStars(id)) localStorage.setItem(`ll_${id}_stars`, stars);
  if (fuelPct > savedFuel(id))  localStorage.setItem(`ll_${id}_fuel`,  fuelPct);
}
function isUnlocked(id)    { return true; }
function totalSavedStars() { return LEVELS.reduce((s, l) => s + savedStars(l.id), 0); }
function maxStars()        { return LEVELS.length * 3; }

const inp = { thrust: false, rotL: false, rotR: false };

const GAME_KEYS = [
  'ArrowUp','ArrowDown','ArrowLeft','ArrowRight',
  'Space','KeyW','KeyA','KeyS','KeyD',
  'Escape','KeyP','Enter','KeyR',
];

window.addEventListener('keydown', e => {
  if (GAME_KEYS.includes(e.code)) e.preventDefault();
  if (e.repeat) return;

  if (gState === 'FLYING') {
    if (e.code === 'ArrowUp'    || e.code === 'KeyW' || e.code === 'Space') inp.thrust = true;
    if (e.code === 'ArrowLeft'  || e.code === 'KeyA') inp.rotL = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') inp.rotR = true;
    if (e.code === 'Escape'     || e.code === 'KeyP') { gState = 'PAUSED'; menuSel = 0; clearFlight(); }

  } else if (gState === 'PAUSED') {
    if (e.code === 'ArrowUp')                         menuSel = (menuSel + 3) % 4;
    if (e.code === 'ArrowDown')                       menuSel = (menuSel + 1) % 4;
    if (e.code === 'Escape' || e.code === 'KeyP')     { gState = 'FLYING'; }
    if (e.code === 'Enter'  || e.code === 'Space') {
      if      (menuSel === 0) { gState = 'FLYING'; }
      else if (menuSel === 1) { initShip(); gState = 'FLYING'; }
      else if (menuSel === 2) { gState = 'LEVEL_SELECT'; menuSel = 0; }
      else if (menuSel === 3) { gState = 'MAIN_MENU';    menuSel = 0; }
    }

  } else if (gState === 'SUCCESS_ANIMATION') {
    if (e.code === 'Space' || e.code === 'Escape') skipAnimation();  // SPEC-09 §8

  } else if (gState === 'RESULTS') {
    const items = resultsItems();
    if (e.code === 'ArrowUp')   menuSel = (menuSel + items.length - 1) % items.length;
    if (e.code === 'ArrowDown') menuSel = (menuSel + 1) % items.length;
    if (e.code === 'Enter' || e.code === 'Space') items[menuSel].action();
    if (e.code === 'KeyR') items.find(it => it.label === 'RETRY').action();

  } else if (gState === 'MISSION_FAILED') {
    if (e.code === 'ArrowUp')   menuSel = (menuSel + 2) % 3;
    if (e.code === 'ArrowDown') menuSel = (menuSel + 1) % 3;
    if (e.code === 'Enter' || e.code === 'Space' || e.code === 'KeyR') {
      const idx = e.code === 'KeyR' ? 0 : menuSel;
      if      (idx === 0) { restart(); }
      else if (idx === 1) { gState = 'LEVEL_SELECT'; menuSel = level.id - 1; }
      else if (idx === 2) { gState = 'MAIN_MENU';    menuSel = 0; }
    }

  } else if (gState === 'MAIN_MENU') {
    if (e.code === 'ArrowUp')   menuSel = (menuSel + 3) % 4;
    if (e.code === 'ArrowDown') menuSel = (menuSel + 1) % 4;
    if (e.code === 'Enter' || e.code === 'Space') {
      if      (menuSel === 0) { initShip(); fadeTransition(0.3, () => { gState = 'FLYING'; }); }
      else if (menuSel === 1) { gState = 'LEVEL_SELECT'; menuSel = 0; }
      else if (menuSel === 2) { gState = 'HOW_TO_PLAY'; menuSel = 0; }
      else if (menuSel === 3) { gState = 'HOW_TO_PLAY'; menuSel = 0; } // Credits → How to Play for now
    }

  } else if (gState === 'LEVEL_SELECT') {
    if (e.code === 'ArrowLeft')  menuSel = Math.max(0,  menuSel - 1);
    if (e.code === 'ArrowRight') menuSel = Math.min(LEVELS.length - 1, menuSel + 1);
    if (e.code === 'ArrowUp')    menuSel = Math.max(0,  menuSel - 4);
    if (e.code === 'ArrowDown')  menuSel = Math.min(LEVELS.length - 1, menuSel + 4);
    if (e.code === 'Escape')     { gState = 'MAIN_MENU'; menuSel = 0; }
    if (e.code === 'Enter' || e.code === 'Space') {
      const sel = LEVELS[menuSel];
      if (sel && isUnlocked(sel.id)) {
        level = sel;
        // Snapshot debris start-X positions so each attempt resets them (SPEC-12)
        _debrisSnap = (level.debris || []).map(d => d.x);
        initShip();
        fadeTransition(0.3, () => { gState = 'FLYING'; });
      }
    }

  } else if (gState === 'HOW_TO_PLAY') {
    if (e.code === 'Escape' || e.code === 'Enter' || e.code === 'Space') { gState = 'MAIN_MENU'; menuSel = 0; }
  }
});

window.addEventListener('keyup', e => {
  if (e.code === 'ArrowUp'    || e.code === 'KeyW' || e.code === 'Space') inp.thrust = false;
  if (e.code === 'ArrowLeft'  || e.code === 'KeyA') inp.rotL   = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') inp.rotR   = false;
});

// ================================================================
// TOUCH / CLICK  — menu navigation
// ================================================================
let _hitboxes = [];  // populated each frame by menu draw functions

function _canvasXY(e) {
  const rect = canvas.getBoundingClientRect();
  const sx = CW / rect.width, sy = CH / rect.height;
  const src = e.changedTouches ? e.changedTouches[0] : e;
  return { x: (src.clientX - rect.left) * sx, y: (src.clientY - rect.top) * sy };
}
function _hitTest(e) {
  const { x, y } = _canvasXY(e);
  for (const h of _hitboxes) {
    if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) { h.action(); return; }
  }
}
canvas.addEventListener('click', e => _hitTest(e));

// ================================================================
// iOS ON-SCREEN BUTTONS  (FLYING state only)
// Three zones at the bottom of the canvas — supports multi-touch.
// ================================================================
const BTN_Y = CH - 110;
const BTNS = isIOS ? {
  rotL:   { x: 0,   y: BTN_Y, w: 300, h: 110 },
  thrust: { x: 300, y: BTN_Y, w: 300, h: 110 },
  rotR:   { x: 600, y: BTN_Y, w: 300, h: 110 },
} : null;

const _activeTouches = new Map(); // touchId → 'rotL'|'thrust'|'rotR'

function _btnAt(cx, cy) {
  if (!BTNS) return null;
  for (const [name, b] of Object.entries(BTNS)) {
    if (cx >= b.x && cx <= b.x + b.w && cy >= b.y && cy <= b.y + b.h) return name;
  }
  return null;
}

function _syncButtons() {
  inp.rotL   = false; inp.rotR   = false; inp.thrust = false;
  for (const btn of _activeTouches.values()) inp[btn] = true;
}

function _touchCanvasXY(touch) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (touch.clientX - rect.left) * (CW / rect.width),
    y: (touch.clientY - rect.top)  * (CH / rect.height),
  };
}

if (isIOS) {
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (gState === 'FLYING') {
      Array.from(e.changedTouches).forEach(t => {
        const { x, y } = _touchCanvasXY(t);
        const btn = _btnAt(x, y);
        if (btn) { _activeTouches.set(t.identifier, btn); _syncButtons(); }
      });
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', e => { e.preventDefault(); }, { passive: false });

  canvas.addEventListener('touchend', e => {
    e.preventDefault();
    if (gState === 'FLYING') {
      const hadBtn = Array.from(e.changedTouches).some(t => _activeTouches.has(t.identifier));
      Array.from(e.changedTouches).forEach(t => _activeTouches.delete(t.identifier));
      _syncButtons();
      if (!hadBtn) _hitTest(e);  // tap outside flight buttons → check overlay hitboxes (e.g. pause)
    } else {
      _hitTest(e);
    }
  }, { passive: false });

  canvas.addEventListener('touchcancel', e => {
    Array.from(e.changedTouches).forEach(t => _activeTouches.delete(t.identifier));
    _syncButtons();
  }, { passive: false });
} else {
  canvas.addEventListener('touchend', e => { e.preventDefault(); _hitTest(e); }, { passive: false });
}

// ================================================================
// MOBILE OVERLAY BUTTONS  (pause + fullscreen)
// ================================================================
let _toastMsg = '', _toastUntil = 0;
function showToast(msg) { _toastMsg = msg; _toastUntil = performance.now() / 1000 + 3; }

function toggleFullscreen() {
  const el = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else if (el.requestFullscreen) {
    el.requestFullscreen().catch(() => showToast('Tip: Add to Home Screen for fullscreen'));
  } else if (el.webkitRequestFullscreen) {
    el.webkitRequestFullscreen();
  } else {
    showToast('Tip: Add to Home Screen for fullscreen');
  }
}

function drawToast(now) {
  if (!_toastMsg || now > _toastUntil) return;
  const a = Math.min(1, (_toastUntil - now) * 1.5);
  ctx.textAlign = 'center';
  ctx.fillStyle = `rgba(0,0,0,${a * 0.85})`; ctx.fillRect(CW/2 - 210, CH/2 - 20, 420, 38);
  ctx.strokeStyle = `rgba(255,255,255,${a * 0.3})`; ctx.lineWidth = 1; ctx.strokeRect(CW/2 - 210, CH/2 - 20, 420, 38);
  ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.font = '12px monospace';
  ctx.fillText(_toastMsg, CW/2, CH/2 + 5); ctx.textAlign = 'left';
}

// Small square button drawn at top-right corner; registers its own hitbox.
const _CBTN = { x: CW - 54, y: 8, w: 46, h: 46 };
function drawMobileCornerBtn(icon, action) {
  if (!isMobile) return;
  const { x, y, w, h } = _CBTN;
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1.5; ctx.strokeRect(x+1, y+1, w-2, h-2);
  ctx.font = '20px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.textAlign = 'center';
  ctx.fillText(icon, x + w/2, y + h/2 + 7); ctx.textAlign = 'left';
  _hitboxes.push({ x, y, w, h, action });
}

function drawTouchButtons() {
  if (!BTNS) return;
  ctx.textAlign = 'center';
  const icons  = { rotL: '◄', thrust: '▲', rotR: '►' };
  const labels = { rotL: 'ROTATE', thrust: 'THRUST', rotR: 'ROTATE' };
  for (const [name, b] of Object.entries(BTNS)) {
    const active = inp[name];
    // Background — dark base so icons always read clearly
    ctx.fillStyle = active ? 'rgba(255,255,255,0.22)' : 'rgba(0,0,0,0.55)';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    // Border
    ctx.strokeStyle = active ? '#FFFFFF' : 'rgba(255,255,255,0.55)';
    ctx.lineWidth   = active ? 2 : 1.5;
    ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    // Icon
    const cx = b.x + b.w / 2;
    ctx.fillStyle = active ? '#FFFFFF' : 'rgba(255,255,255,0.80)';
    ctx.font = `bold 36px monospace`;
    ctx.fillText(icons[name], cx, b.y + 56);
    // Label
    ctx.font = '11px monospace';
    ctx.fillStyle = active ? '#FFFFFF' : 'rgba(255,255,255,0.55)';
    ctx.fillText(labels[name], cx, b.y + 80);
  }
  ctx.textAlign = 'left';
}

function clearFlight() {
  inp.thrust = false; inp.rotL = false; inp.rotR = false;
  _activeTouches.clear();
}

// ================================================================
// TERRAIN HELPERS  (SPEC-06)
// ================================================================
function terrainY(x) {
  x = ((x % CW) + CW) % CW;
  const t = level.terrain;
  let lo = 0, hi = t.length - 2;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (t[mid + 1].x <= x) lo = mid + 1; else hi = mid;
  }
  const v0 = t[lo], v1 = t[lo + 1];
  return v0.y + (x - v0.x) / (v1.x - v0.x) * (v1.y - v0.y);
}

// Cave roof height at x, or -Infinity where there is no roof (open sky)
function ceilingY(x) {
  const c = level.ceiling;
  if (!c || x < c[0].x || x > c[c.length - 1].x) return -Infinity;
  let i = 0;
  while (c[i + 1].x < x) i++;
  const v0 = c[i], v1 = c[i + 1];
  return v0.y + (x - v0.x) / (v1.x - v0.x) * (v1.y - v0.y);
}

function padAtX(x) {
  for (const p of level.landingPads)
    if (p.active && x >= p.x && x <= p.x + p.width) return p;
  return null;
}

// ================================================================
// MATH HELPERS
// ================================================================
function rotatePt(p, deg) {
  const r = deg * Math.PI / 180;
  const c = Math.cos(r), s = Math.sin(r);
  return { x: p.x * c - p.y * s, y: p.x * s + p.y * c };
}

function worldPt(p, deg, tx, ty) {
  const r = rotatePt(p, deg);
  return { x: r.x + tx, y: r.y + ty };
}

function normAngle(a) { return ((a + 180) % 360) - 180; }

function lerp(a, b, t)  { return a + (b - a) * t; }
function easeOut(t)     { return 1 - Math.pow(1 - t, 2); }
function easeIn(t)      { return t * t; }
function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }

// ================================================================
// INIT
// ================================================================
function initBgStars() {
  bgStars = [];
  for (let i = 0; i < 160; i++)
    bgStars.push({
      x: Math.random() * CW,
      y: Math.random() * CH,
      r: 0.4 + Math.random() * 1.2,
      a: 0.25 + Math.random() * 0.7,
    });
}

// keepStreak: true only for the automatic respawn after a crash; starting or
// restarting a level any other way begins a fresh crash count.
function initShip(keepStreak = false) {
  if (!keepStreak) crashStreak = 0;
  ship = {
    x: level.spawnX, y: level.spawnY,
    vx: 0, vy: 0, angle: 0,
    fuel: level.startingFuel, maxFuel: level.startingFuel,
  };
  particles   = [];
  anim        = null;
  resultsData = null;
  crashTimer  = 0;
  crashMsg    = '';
  crashAlpha  = 0;
  bannerTimer = 0;
  // Reset drifting debris back to their starting positions (SPEC-12)
  if (level.debris && _debrisSnap.length === level.debris.length) {
    level.debris.forEach((d, i) => { d.x = _debrisSnap[i]; });
  }
  resetUFO();  // SPEC-08 §8 — re-spawns if level.ufoEnabled
}

function restart() {
  gState = 'FLYING';
  menuSel = 0;
  initShip();
}

// Fade to black, run callback, fade back in  (SPEC-11 §10)
function fadeTransition(dur, cb) {
  fade.dir = 1; fade.speed = 1 / dur; fade.alpha = 0;
  fade.cb  = () => { cb(); fade.dir = -1; };
}

// ================================================================
// PARTICLES
// ================================================================
// Asteroids-style break-up: each hull line flies off and spins, plus a few sparks
function spawnCrash() {
  for (const [a, b] of SHIP_LINES) {
    const pa = worldPt({ x: a[0], y: a[1] }, ship.angle, ship.x, ship.y);
    const pb = worldPt({ x: b[0], y: b[1] }, ship.angle, ship.x, ship.y);
    const mx = (pa.x + pb.x) / 2, my = (pa.y + pb.y) / 2;
    const out  = Math.atan2(my - ship.y, mx - ship.x) + (Math.random() - 0.5) * 0.6;
    const spd  = 30 + Math.random() * 60;
    const life = 1.2 + Math.random() * 0.4;
    particles.push({
      x: mx, y: my,
      vx: Math.cos(out) * spd, vy: Math.sin(out) * spd - 20,
      life, maxLife: life,
      hx: (pb.x - pa.x) / 2, hy: (pb.y - pa.y) / 2,
      rot: 0, spin: (Math.random() - 0.5) * 6,
      colour: SHIP_COLOUR, type: 'shard',
    });
  }
  for (let i = 0; i < 16; i++) {
    const a   = Math.random() * Math.PI * 2;
    const spd = 40 + Math.random() * 120;
    const life = 0.5 + Math.random() * 0.8;
    particles.push({
      x: ship.x, y: ship.y,
      vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      life, maxLife: life,
      colour: SHIP_COLOUR, sz: 2, type: 'spark',
    });
  }
}

// Grey dust kicked up by landing legs (SPEC-09 §3 SETTLE)
function spawnSettleDust(padY) {
  for (const lx of [ship.x - LANDER.footX, ship.x + LANDER.footX]) {
    for (let i = 0; i < 6; i++) {
      const a   = -Math.PI + Math.random() * Math.PI;
      const spd = 20 + Math.random() * 60;
      const life = 0.3 + Math.random() * 0.3;
      particles.push({
        x: lx, y: padY,
        vx: Math.cos(a) * spd, vy: Math.sin(a) * spd - 15,
        life, maxLife: life,
        r: 200, g: 200, b: 200,
        sz: 1 + Math.random() * 2.5, type: 'dust',
      });
    }
  }
}

// Moon: grey dust at flag planting (SPEC-09 §6.1)
function spawnPlantDust(px, py) {
  for (let i = 0; i < 8; i++) {
    const a   = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.2;
    const spd = 15 + Math.random() * 45;
    const life = 0.25 + Math.random() * 0.2;
    particles.push({
      x: px + (Math.random() - 0.5) * 16, y: py,
      vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      life, maxLife: life,
      r: 180, g: 180, b: 180,
      sz: 1 + Math.random() * 2, type: 'dust',
    });
  }
}

// Wind streak particles (SPEC-07 §3.2) — spawned from updatePhysics when wind ≠ 0
function spawnWindParticles(dt) {
  const windPtCount = particles.reduce((n, p) => n + (p.type === 'wind' ? 1 : 0), 0);
  if (windPtCount >= WIND_PARTICLE_MAX) return;
  const toSpawn = Math.min(
    WIND_PARTICLE_MAX - windPtCount,
    Math.random() < (10 * dt) ? Math.ceil(10 * dt) : 0,
  );
  const colour  = level.windParticleColour || '#CCCCCC';
  const spd     = Math.abs(currentWindAccel) * PPM;
  if (spd < 1) return;
  const fromLeft = currentWindAccel > 0;
  for (let i = 0; i < toSpawn; i++) {
    const vx   = fromLeft ? spd : -spd;
    const life = CW / Math.abs(vx);
    particles.push({
      x:       fromLeft ? -8 : CW + 8,
      y:       Math.random() * CH * 0.85,
      vx,
      vy:      (Math.random() - 0.5) * 12,
      life,
      maxLife: life,
      type:    'wind',
      colour,
      sz:      1.0 + Math.random() * 1.5,
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.type === 'shard') p.rot += p.spin * dt;
    if (p.type === 'dust')  p.vy += 40  * dt;
    // 'wind' particles have no gravity — they just drift
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ================================================================
// STAR RATING  (SPEC-10 §3)
// ================================================================
function calcStars(snap) {
  const ratio = snap.vy / level.maxDescentSpeed;
  if (snap.fuelPct > 0.65 && ratio < 0.30 && snap.angle < 2.0) return 3;
  if (snap.fuelPct > 0.40 && ratio < 0.60)                     return 2;
  return 1;
}

// ================================================================
// COLLISION & LANDING  (SPEC-04)
// ================================================================
function doCrash(reason) {
  if (gState !== 'FLYING') return;
  ship.vx = 0; ship.vy = 0;
  gState     = 'CRASHED';
  crashMsg   = reason;
  crashAlpha = 1;
  crashTimer = 0;
  clearFlight();
  spawnCrash();
  sfxCrash();
}

function doLand(pad) {
  if (gState !== 'FLYING') return;
  sfxLanding();
  // Snapshot captured BEFORE zeroing (SPEC-04 §6.1, SPEC-10 §2)
  const snap = {
    fuelPct: ship.fuel / ship.maxFuel,
    vy:      ship.vy,
    vx:      Math.abs(ship.vx),
    angle:   Math.abs(normAngle(ship.angle)),
  };
  ship.vx = 0; ship.vy = 0;
  ship.angle = 0;
  ship.y = pad.y - LANDER.footY;  // legs at pad.y
  clearFlight();

  // UFO success-animation behaviour  (SPEC-08 §7)
  if (ufo.active) {
    if (level.environment === 'TITAN') {
      ufo.orbitSpeed *= 0.3;   // slows to a curious hover
      ufo.baseRadius  = 80;    // tightens orbit around landing site
    } else {
      ufo.active = false;      // disappears on Io and all other planets
    }
  }

  beginSuccessAnimation(pad, snap);
}

function checkCollision() {
  const pts = LANDER.collPts.map(p => worldPt(p, ship.angle, ship.x, ship.y));
  if (pts.some(pt => pt.y < ceilingY(pt.x))) { doCrash('CRASHED'); return; }
  for (const pt of pts) {
    if (pt.y < terrainY(pt.x)) continue;
    const legL = worldPt({ x: -LANDER.footX, y: LANDER.footY }, ship.angle, ship.x, ship.y);
    const legR = worldPt({ x:  LANDER.footX, y: LANDER.footY }, ship.angle, ship.x, ship.y);
    const padL = padAtX(legL.x);
    const padR = padAtX(legR.x);
    if (padL && padR && padL.id === padR.id) {
      const na = Math.abs(normAngle(ship.angle));
      if (na > 90)                                   { doCrash('UPSIDE DOWN');   return; }
      if (ship.vy > level.maxDescentSpeed)           { doCrash('TOO FAST');      return; }
      if (Math.abs(ship.vx) > level.maxLateralSpeed) { doCrash('LATERAL DRIFT'); return; }
      if (na > MAX_LAND_ANGLE)                       { doCrash('BAD ANGLE');     return; }
      doLand(padL);
    } else {
      doCrash('CRASHED');
    }
    return;
  }

  // Debris AABB collision  (SPEC-07 §5.3)
  if (level.debris && level.debris.length > 0) {
    const lx = ship.x - LANDER.width  / 2;
    const rx = ship.x + LANDER.width  / 2;
    const ty = ship.y - LANDER.height / 2;
    const by = ship.y + LANDER.height / 2;
    for (const d of level.debris) {
      if (rx > d.x && lx < d.x + d.w && by > d.y && ty < d.y + d.h) {
        doCrash('CRASHED');
        return;
      }
    }
  }
}

// ================================================================
// PHYSICS  (SPEC-01 §3)
// ================================================================
function updatePhysics(dt) {
  if (inp.rotL) ship.angle -= LANDER.rotationSpeed * dt;
  if (inp.rotR) ship.angle += LANDER.rotationSpeed * dt;
  ship.angle = ((ship.angle % 360) + 360) % 360;

  if (inp.thrust && ship.fuel > 0) {
    const aRad = (ship.angle - 90) * Math.PI / 180;
    ship.vx += Math.cos(aRad) * LANDER.thrustPower * PPM * dt;
    ship.vy += Math.sin(aRad) * LANDER.thrustPower * PPM * dt;
    ship.fuel = Math.max(0, ship.fuel - BURN_RATE * dt);
  }

  ship.vy += level.gravity * PPM * dt;

  if (level.drag > 0) {
    const spd = Math.hypot(ship.vx, ship.vy);
    if (spd > 0) {
      const df = level.drag * spd * spd * dt;
      ship.vx -= (ship.vx / spd) * df;
      ship.vy -= (ship.vy / spd) * df;
    }
  }

  if (level.wind !== 0) {
    const gust = level.gustEnabled
      ? Math.sin(Date.now() * 0.001 * level.gustFrequency * Math.PI * 2) * level.gustAmplitude
      : 0;
    currentWindAccel = level.wind + gust;
    gustWarning      = level.gustEnabled && Math.abs(gust) > level.gustAmplitude * 0.5;
    ship.vx += currentWindAccel * PPM * dt;
    spawnWindParticles(dt);
  } else {
    currentWindAccel = 0;
    gustWarning      = false;
  }

  const spd = Math.hypot(ship.vx, ship.vy);
  if (spd > MAX_SPEED) { ship.vx *= MAX_SPEED / spd; ship.vy *= MAX_SPEED / spd; }

  ship.x += ship.vx * dt;
  ship.y += ship.vy * dt;

  if (ship.x >  CW + 25) ship.x = -25;
  if (ship.x < -25)       ship.x =  CW + 25;
  if (ship.y < 0) { ship.y = 0; ship.vy = 0; }

  checkCollision();
}

// ================================================================
// PROXIMITY WARNINGS  — ship outline pulse + sonar ping
// ================================================================
const WARN_DANGER_ALT = 80;  // px above ground where a too-fast descent warns
const WARN_NEAR_DIST  = 15;  // px from rock that triggers the proximity warning
const WARN = {
  danger: { colour: [255,  64, 64], period: 0.40, freq: 1400, gain: 0.22, dur: 0.30 },
  near:   { colour: [255, 160, 40], period: 0.90, freq:  800, gain: 0.07, dur: 0.50 },
};
let shipWarn  = null;  // null | 'danger' | 'near'
let warnTimer = 0;     // seconds since the last ping

// Distance from point to segment, plus the nearest point on the segment
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const t  = clamp(((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy), 0, 1);
  const nx = ax + t * dx, ny = ay + t * dy;
  return { d: Math.hypot(px - nx, py - ny), x: nx, y: ny };
}

// Closest distance from the ship to rock (ground, walls, cave roof). Pad surfaces
// don't count — being close to the pad is the point of landing.
function rockDistance() {
  const pts = LANDER.collPts.map(p => worldPt(p, ship.angle, ship.x, ship.y));
  let min = Infinity;
  for (const poly of [level.terrain, level.ceiling]) {
    if (!poly) continue;
    for (let i = 0; i < poly.length - 1; i++) {
      const a = poly[i], b = poly[i + 1];
      for (const pt of pts) {
        const s = segDist(pt.x, pt.y, a.x, a.y, b.x, b.y);
        const pad = padAtX(s.x);
        if (pad && Math.abs(s.y - pad.y) < 1) continue;
        min = Math.min(min, s.d);
      }
    }
  }
  return min;
}

function updateWarnings(dt) {
  const alt = terrainY(ship.x) - (ship.y + LANDER.footY);
  let w = null;
  if (alt < WARN_DANGER_ALT && ship.vy > level.maxDescentSpeed) w = 'danger';
  else if (rockDistance() < WARN_NEAR_DIST)                     w = 'near';

  if (w !== shipWarn) {
    shipWarn = w; warnTimer = 0;
    if (w) playSonar(w);
  } else if (w) {
    warnTimer += dt;
    if (warnTimer >= WARN[w].period) { warnTimer -= WARN[w].period; playSonar(w); }
  }
}

// ================================================================
// AUDIO  — everything is synthesised with Web Audio (no sample files).
// The context can only start after a user gesture, so it's created lazily.
// ================================================================
let audioCtx   = null;
let masterGain = null;   // all sound goes through here (M toggles mute)
let noiseBuf   = null;   // 2 s of white noise, shared by every noisy effect
let thrustGain = null;   // continuous engine rumble, faded in/out each frame
let soundOn    = true;
let radioTimer = 6;      // seconds until the next chatter / static burst

function unlockAudio() {
  try {
    if (!audioCtx) {
      audioCtx   = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = soundOn ? 1 : 0;
      masterGain.connect(audioCtx.destination);

      noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

      // Thruster: looped noise through a low-pass, plus a faint 55 Hz square buzz
      thrustGain = audioCtx.createGain();
      thrustGain.gain.value = 0;
      thrustGain.connect(masterGain);
      const src = audioCtx.createBufferSource();
      src.buffer = noiseBuf; src.loop = true;
      const lp = audioCtx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 500;
      src.connect(lp).connect(thrustGain);
      src.start();
      const buzz = audioCtx.createOscillator();
      const buzzAmp = audioCtx.createGain();
      buzz.type = 'square'; buzz.frequency.value = 55; buzzAmp.gain.value = 0.04;
      buzz.connect(buzzAmp).connect(thrustGain);
      buzz.start();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) { audioCtx = null; }
}
for (const ev of ['keydown', 'pointerdown', 'touchstart']) {
  window.addEventListener(ev, unlockAudio, { passive: true });
}
window.addEventListener('keydown', e => {
  if (e.code !== 'KeyM' || e.repeat) return;
  soundOn = !soundOn;
  if (masterGain) masterGain.gain.setTargetAtTime(soundOn ? 1 : 0, audioCtx.currentTime, 0.02);
  showToast(soundOn ? 'SOUND ON' : 'SOUND OFF  (M to toggle)');
});

function audioReady() { return audioCtx && audioCtx.state === 'running'; }

// Short enveloped oscillator note
function tone(type, freq, t0, dur, gain, freqEnd) {
  const osc = audioCtx.createOscillator();
  const amp = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, t0 + dur);
  amp.gain.setValueAtTime(0.0001, t0);
  amp.gain.linearRampToValueAtTime(gain, t0 + 0.005);
  amp.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(amp).connect(masterGain);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
  return osc;
}

// Noise burst through a filter whose cutoff sweeps fStart → fEnd
function noiseBurst(t0, dur, gain, type, fStart, fEnd, q = 1) {
  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuf;
  src.playbackRate.value = 0.5 + Math.random();
  const f = audioCtx.createBiquadFilter();
  f.type = type; f.Q.value = q;
  f.frequency.setValueAtTime(fStart, t0);
  f.frequency.exponentialRampToValueAtTime(fEnd, t0 + dur);
  const amp = audioCtx.createGain();
  amp.gain.setValueAtTime(gain, t0);
  amp.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f).connect(amp).connect(masterGain);
  src.start(t0, Math.random());
  src.stop(t0 + dur + 0.02);
}

// Called every frame: engine follows the thrust input, radio fires at random
function updateAudio(dt) {
  if (!audioReady()) return;
  const firing = gState === 'FLYING' && inp.thrust && ship.fuel > 0;
  thrustGain.gain.setTargetAtTime(firing ? 0.35 : 0, audioCtx.currentTime, firing ? 0.03 : 0.08);

  if (gState !== 'FLYING') return;
  radioTimer -= dt;
  if (radioTimer <= 0) {
    if (Math.random() < 0.6) sfxRadioChatter(); else sfxRadioStatic();
    radioTimer = 7 + Math.random() * 12;
  }
}

// Sonar ping: a sine blip gliding slightly down in pitch, with a fainter echo
function playSonar(kind) {
  if (!audioReady()) return;
  const w = WARN[kind], t = audioCtx.currentTime;
  tone('sine', w.freq, t,        w.dur, w.gain,       w.freq * 0.85);
  tone('sine', w.freq, t + 0.12, w.dur, w.gain * 0.3, w.freq * 0.85);
}

// Explosion: a soft, muffled boom that swells in and rolls away over ~4 s,
// with a deep thump underneath and a few faint crackles as it dies down
function sfxCrash() {
  if (!audioReady()) return;
  const t = audioCtx.currentTime;
  const DUR = 4;

  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuf; src.loop = true;
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass'; lp.Q.value = 0.5;
  lp.frequency.setValueAtTime(1200, t);
  lp.frequency.exponentialRampToValueAtTime(60, t + DUR);
  const amp = audioCtx.createGain();
  amp.gain.setValueAtTime(0.0001, t);
  amp.gain.linearRampToValueAtTime(0.35, t + 0.08);        // soft attack, no hard click
  amp.gain.exponentialRampToValueAtTime(0.0001, t + DUR);
  src.connect(lp).connect(amp).connect(masterGain);
  src.start(t);
  src.stop(t + DUR + 0.05);

  tone('sine', 90, t, 1.4, 0.25, 30);
  for (let i = 0; i < 4; i++) {
    noiseBurst(t + 0.3 + Math.random() * 1.8, 0.06, 0.05, 'bandpass', 1800, 900, 2);
  }
}

// Landing: rising square-wave arpeggio resolving to a held major chord
function sfxLanding() {
  if (!audioReady()) return;
  const t = audioCtx.currentTime;
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone('square', f, t + i * 0.09, 0.12, 0.08));
  [523.25, 659.25, 783.99].forEach(f => tone('triangle', f, t + 0.4, 1.2, 0.12));
  tone('square', 1046.5, t + 0.4, 1.2, 0.05);
}

// Radio chatter: Quindar beep, squelch, garbled "voice" syllables, squelch, beep.
// The voice is a buzzy sawtooth with jumping pitch, band-passed to radio range.
function sfxRadioChatter() {
  const t = audioCtx.currentTime;
  tone('sine', 2525, t, 0.25, 0.05);                       // NASA-style intro tone
  noiseBurst(t + 0.25, 0.12, 0.12, 'bandpass', 3000, 1500, 0.8);

  const voice = audioCtx.createOscillator();
  voice.type = 'sawtooth';
  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 1200; bp.Q.value = 1.2;
  const crunch = audioCtx.createWaveShaper();
  const curve = new Float32Array(256);
  for (let i = 0; i < 256; i++) { const x = i / 128 - 1; curve[i] = Math.tanh(x * 4); }
  crunch.curve = curve;
  const amp = audioCtx.createGain();
  amp.gain.value = 0;
  voice.connect(bp).connect(crunch).connect(amp).connect(masterGain);

  let s = t + 0.35;
  const end = s + 1 + Math.random() * 1.5;
  const base = 110 + Math.random() * 60;
  while (s < end) {
    const len = 0.06 + Math.random() * 0.14;
    voice.frequency.setValueAtTime(base * (0.8 + Math.random() * 0.6), s);
    bp.frequency.setValueAtTime(800 + Math.random() * 1400, s);
    amp.gain.setValueAtTime(0, s);
    amp.gain.linearRampToValueAtTime(0.05, s + 0.015);
    amp.gain.linearRampToValueAtTime(0, s + len);
    s += len + (Math.random() < 0.2 ? 0.15 : 0.02);
  }
  voice.start(t + 0.35);
  voice.stop(s + 0.05);
  noiseBurst(t + 0.35, s - t - 0.35, 0.02, 'bandpass', 2000, 2000, 0.7); // carrier hiss

  noiseBurst(s, 0.15, 0.12, 'bandpass', 3000, 1500, 0.8);
  tone('sine', 2475, s + 0.15, 0.25, 0.05);                // outro tone
}

// Radio static: a cluster of crackles and a short data blip
function sfxRadioStatic() {
  const t = audioCtx.currentTime;
  const n = 4 + Math.floor(Math.random() * 6);
  for (let i = 0; i < n; i++) {
    noiseBurst(t + Math.random() * 0.8, 0.03 + Math.random() * 0.1, 0.06, 'bandpass', 2500, 1800, 2);
  }
  if (Math.random() < 0.5) {
    for (let i = 0; i < 4; i++) tone('square', 1800 + Math.random() * 800, t + 0.9 + i * 0.07, 0.05, 0.025);
  }
}

// ================================================================
// SUCCESS ANIMATION  (SPEC-09)
// ================================================================
function beginSuccessAnimation(pad, snap) {
  gState = 'SUCCESS_ANIMATION';
  spawnSettleDust(pad.y);

  anim = {
    phase:        0,
    phaseElapsed: 0,
    totalElapsed: 0,
    skipHinted:   false,

    // Geometry anchors
    landX:  ship.x,
    landY:  ship.y,
    padY:   pad.y,
    snap,
    stars:  calcStars(snap),

    // Camera  (SPEC-09 §4)
    zoom:       1.0,
    letterbox:  0.0,  // 0–1 progress of 48px bars

    // Hatch
    hatchAngle: 0,    // radians — opens to –π/2

    // Astronaut
    astX:       ship.x,
    astFootY:   pad.y,
    armState:   'down',
    astVisible: false,

    // Flag
    flagUnfurl:         0,
    plantDustSpawned:   false,

    // End fade
    fadeAlpha: 0,
  };
}

function skipAnimation() {
  if (!anim) return;
  saveProgress(level.id, anim.stars, anim.snap.fuelPct);  // SPEC-10 §5
  resultsData = { snap: anim.snap, stars: anim.stars };
  anim    = null;
  menuSel = 0;
  gState  = 'RESULTS';
}

function endAnimation() {
  saveProgress(level.id, anim.stars, anim.snap.fuelPct);  // SPEC-10 §5
  resultsData = { snap: anim.snap, stars: anim.stars };
  anim    = null;
  menuSel = 0;
  gState  = 'RESULTS';
}

function updateAnimation(dt) {
  if (!anim) return;
  anim.phaseElapsed += dt;
  anim.totalElapsed += dt;

  // Show skip hint after 1 s (SPEC-09 §8)
  if (!anim.skipHinted && anim.totalElapsed >= 1.0) anim.skipHinted = true;

  // Camera zoom 1.0 → 0.75 over 1.5 s (SPEC-09 §4.1)
  const zT = clamp(anim.totalElapsed / ZOOM_DUR, 0, 1);
  anim.zoom = lerp(1.0, ZOOM_TARGET, easeOut(zT));

  // Letterbox bars 0 → full over 0.4 s (SPEC-09 §4.2)
  anim.letterbox = clamp(anim.totalElapsed / 0.4, 0, 1);

  const ph  = PHASES[anim.phase];
  const t   = clamp(anim.phaseElapsed / ph.dur, 0, 1); // normalised phase progress
  const lx  = anim.landX;
  const py  = anim.padY;
  const gx  = lx + 9;              // ground position X (right side of lander)
  const plx = lx + PLANT_OFFSET;   // flag plant X
  const stX = plx - ARM_REACH;     // astronaut stands at arm's length from the pole

  // ---- Per-phase logic ----
  if (ph.name === 'SETTLE') {
    // Leg-compression bob: small downward then upward motion
    anim.settleY = Math.sin(t * Math.PI) * 2; // +2px at midpoint, back to 0
    anim.hatchAngle = 0;
  }

  if (ph.name === 'HATCH_OPEN') {
    // Hatch swings from 0 to -π/2 (SPEC-09 §3)
    anim.hatchAngle = -Math.PI / 2 * easeOut(t);
    anim.settleY    = 0;
  }

  if (ph.name === 'EMERGE') {
    anim.hatchAngle = -Math.PI / 2; // fully open
    anim.astVisible = true;
    // Astronaut lerps from hatch world position to ground beside lander
    const hatchWorldY = anim.landY - 11; // top of lander body
    anim.astX     = lerp(lx, gx, easeOut(t));
    anim.astFootY = lerp(hatchWorldY, py, easeOut(t));
  }

  if (ph.name === 'WALK') {
    anim.astVisible = true;
    anim.armState   = 'down';
    // Moon gait: bouncy low-gravity float (SPEC-09 §5.3)
    const gait    = -Math.abs(Math.sin(t * Math.PI * 3)) * 8;
    anim.astX     = lerp(gx, stX, t);
    anim.astFootY = py + gait;
  }

  if (ph.name === 'PLANT') {
    anim.astX     = stX;
    anim.astFootY = py;
    anim.armState = 'planting';
    // Flag unfurls in the first 60% of this phase (SPEC-09 §6)
    anim.flagUnfurl = clamp(t / 0.6, 0, 1);
    // Spawn dust once at start of PLANT
    if (!anim.plantDustSpawned) {
      anim.plantDustSpawned = true;
      spawnPlantDust(plx, py);
    }
  }

  if (ph.name === 'HOLD') {
    anim.astX     = stX;
    anim.astFootY = py;
    anim.armState = 'salute'; // Moon: astronaut salutes (SPEC-09 §7.1)
    anim.flagUnfurl = 1;
  }

  if (ph.name === 'FADE') {
    anim.fadeAlpha = clamp(anim.phaseElapsed / ph.dur, 0, 1);
    anim.flagUnfurl = 1;
    anim.armState   = 'salute';
  }

  // ---- Phase transition ----
  if (anim.phaseElapsed >= ph.dur) {
    anim.phaseElapsed -= ph.dur;
    anim.phase++;
    if (anim.phase >= PHASES.length) {
      endAnimation();
    }
  }
}

// ================================================================
// DRAW — WORLD ELEMENTS
// ================================================================
// Vector-arcade phosphor glow; call vectorGlow(null) to switch off
function vectorGlow(col, blur = 10) {
  ctx.shadowColor = col || 'transparent';
  ctx.shadowBlur  = col ? blur : 0;
}

function strokeLines(lines) {
  ctx.beginPath();
  for (const [a, b] of lines) { ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); }
  ctx.stroke();
}

function drawBackground() {
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, CW, CH);
  for (const s of bgStars) {
    if (ceilingY(s.x) > -Infinity) continue;   // no sky inside or above a cave
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${s.a})`;
    ctx.fill();
  }
}

// extend: extra world units added to bottom/sides so fill survives camera zoom
// Glowing outline over a 25% tint of the level colour. The fill is laid on black
// first so stars and particles behind rock stay hidden.
// The outline is carried flat past both screen edges so it survives camera zoom-out.
function drawTerrain(extend = 600) {
  const t = level.terrain, last = t[t.length - 1];
  const tracePath = () => {
    ctx.moveTo(-extend, t[0].y);
    for (const p of t) ctx.lineTo(p.x, p.y);
    ctx.lineTo(CW + extend, last.y);
  };
  const fillRock = () => {
    ctx.fillStyle = '#000000';
    ctx.fill();
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = level.terrainEdgeColour;
    ctx.fill();
    ctx.globalAlpha = 1;
  };
  ctx.beginPath();
  tracePath();
  ctx.lineTo(CW + extend, CH + extend);
  ctx.lineTo(-extend, CH + extend);
  ctx.closePath();
  fillRock();

  // Cave roof: rock fills from the ceiling line up and off the right edge
  const c = level.ceiling;
  const traceCeiling = () => {
    ctx.moveTo(c[0].x, -extend);
    for (const p of c) ctx.lineTo(p.x, p.y);
    ctx.lineTo(CW + extend, c[c.length - 1].y);
  };
  if (c) {
    ctx.beginPath();
    traceCeiling();
    ctx.lineTo(CW + extend, -extend);
    ctx.closePath();
    fillRock();
  }

  ctx.beginPath();
  tracePath();
  if (c) traceCeiling();

  vectorGlow(level.terrainEdgeColour, 12);
  ctx.strokeStyle = level.terrainEdgeColour;
  ctx.lineWidth   = 2;
  ctx.lineJoin    = 'round';
  ctx.stroke();
  vectorGlow(null);
}

function drawPads(now) {
  for (const pad of level.landingPads) {
    const col = pad.active ? '#30FF90' : '#FF4040';
    vectorGlow(col, 10);
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(pad.x, pad.y - 1); ctx.lineTo(pad.x + pad.width, pad.y - 1);
    ctx.moveTo(pad.x, pad.y - 6); ctx.lineTo(pad.x + pad.width, pad.y - 6);
    ctx.moveTo(pad.x + 1,             pad.y - 1); ctx.lineTo(pad.x + 1,             pad.y - 12);
    ctx.moveTo(pad.x + pad.width - 1, pad.y - 1); ctx.lineTo(pad.x + pad.width - 1, pad.y - 12);
    ctx.stroke();
    vectorGlow(null);

    if (pad.active && pad.beacon && gState !== 'SUCCESS_ANIMATION') {
      const pulse = 0.5 + 0.5 * Math.sin(now * Math.PI * 3);
      const cx = pad.x + pad.width / 2;
      for (let dy = 8; dy < 88; dy += 8) {
        const a = pulse * (1 - dy / 88) * 0.65;
        ctx.fillStyle = `rgba(0,255,136,${a})`;
        ctx.fillRect(cx - 1.5, pad.y - 4 - dy - 4, 3, 4);
      }
      ctx.beginPath();
      ctx.arc(cx, pad.y - 92, 4, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0,255,136,${pulse * 0.85})`;
      ctx.fill();
    }
  }
}

// yOffset: used during SETTLE to animate leg compression
// Asteroids-style hull with strut legs. Nose and feet match LANDER.collPts.
const SHIP_LINES = [
  [[  0, -11], [  6,  7]], [[  0, -11], [ -6,  7]],   // hull sides
  [[ -5,   4], [  5,  4]],                            // crossbar
  [[3.5,   4], [ 10, 11]], [[-3.5,  4], [-10, 11]],   // legs
  [[  8,  11], [ 13, 11]], [[ -8,  11], [-13, 11]],   // feet
];
const SHIP_COLOUR = '#FFFFFF';

// yOffset: used during SETTLE to animate leg compression
function drawShip(yOffset = 0) {
  // Hull has shattered into 'shard' particles
  if (gState === 'CRASHED' || gState === 'MISSION_FAILED') return;
  const x = ship.x;
  const y = ship.y + yOffset;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ship.angle * Math.PI / 180);
  if (shipWarn) {
    // Outline flares to the warning colour on each ping, then fades back to white
    const w = WARN[shipWarn];
    const k = 1 - warnTimer / w.period;
    const [r, g, b] = w.colour.map(c => Math.round(255 + (c - 255) * k));
    vectorGlow(`rgba(${w.colour.join(',')},0.9)`, 10 + 10 * k);
    ctx.strokeStyle = `rgb(${r},${g},${b})`;
  } else {
    vectorGlow('rgba(200,220,255,0.9)', 10);
    ctx.strokeStyle = SHIP_COLOUR;
  }
  ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  strokeLines(SHIP_LINES);

  // Flickering V flame below the crossbar, as in Asteroids
  if (inp.thrust && ship.fuel > 0 && gState === 'FLYING' && Math.random() > 0.25) {
    const len = 11 + Math.random() * 4;
    ctx.beginPath();
    ctx.moveTo(-2.5, 4); ctx.lineTo(0, len); ctx.lineTo(2.5, 4);
    ctx.stroke();
  }

  // Hatch — nose segment swings open, only during SUCCESS_ANIMATION
  if (anim) {
    ctx.save();
    ctx.translate(-1.5, -6);             // hinge point on left hull side
    ctx.rotate(anim.hatchAngle);         // swings open to –π/2
    strokeLines([[[0, 0], [3, 0]]]);
    ctx.restore();
  }

  ctx.lineCap = 'butt';
  vectorGlow(null);
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    const a = Math.max(0, p.life / p.maxLife);
    if (p.type === 'wind') {
      // Short horizontal streak (SPEC-07 §3.2)
      const len = 6 + p.sz * 5;
      ctx.save();
      ctx.globalAlpha  = a * 0.5;
      ctx.strokeStyle  = p.colour || '#CCCCCC';
      ctx.lineWidth    = p.sz;
      ctx.lineCap      = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - Math.sign(p.vx) * len, p.y);
      ctx.stroke();
      ctx.restore();
    } else if (p.type === 'shard') {
      const c = Math.cos(p.rot), s = Math.sin(p.rot);
      const dx = p.hx * c - p.hy * s, dy = p.hx * s + p.hy * c;
      ctx.save();
      ctx.globalAlpha = a;
      vectorGlow('rgba(200,220,255,0.9)', 10);
      ctx.strokeStyle = p.colour; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      strokeLines([[[p.x - dx, p.y - dy], [p.x + dx, p.y + dy]]]);
      ctx.restore();
    } else if (p.type === 'spark') {
      ctx.globalAlpha = a;
      ctx.fillStyle = p.colour;
      ctx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz);
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = a;
      ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;
      ctx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz);
      ctx.globalAlpha = 1;
    }
  }
}

// ================================================================
// ASTRONAUT  (SPEC-09 §5)
// ================================================================
// ax, ay = foot position in world space
function drawAstronaut(ax, ay, armState) {
  ctx.save();
  ctx.translate(ax, ay);
  ctx.scale(0.5, 0.5);                 // half size, to match the lander

  vectorGlow('rgba(200,220,255,0.9)', 8);
  ctx.strokeStyle = SHIP_COLOUR;
  ctx.lineWidth   = 3.2;               // 1.6px on screen after scaling
  ctx.lineCap     = 'round';

  // Legs (two simple lines from ground up)
  ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(-3, -10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( 3, 0); ctx.lineTo( 3, -10); ctx.stroke();

  // Body (spacesuit torso)
  ctx.strokeRect(-7, -24, 14, 14);

  // Left arm (always hanging)
  ctx.beginPath(); ctx.moveTo(-7, -20); ctx.lineTo(-13, -14); ctx.stroke();

  // Right arm — context-dependent
  ctx.beginPath();
  if (armState === 'salute') {
    ctx.moveTo(7, -20); ctx.lineTo(14, -28); // arm raised for salute
  } else if (armState === 'planting') {
    ctx.moveTo(7, -20); ctx.lineTo(14, -22); // arm reaching out to the pole
  } else {
    ctx.moveTo(7, -20); ctx.lineTo(13, -14); // arm hanging
  }
  ctx.stroke();

  // Helmet (SPEC-09 §5 — "astronaut walks in bouncy low-gravity gait")
  ctx.beginPath();
  ctx.arc(0, -30, 9, 0, Math.PI * 2);
  ctx.stroke();

  // Visor
  ctx.beginPath();
  ctx.ellipse(0, -29, 5.5, 5, 0, 0.5, Math.PI - 0.5);
  ctx.stroke();

  ctx.lineCap = 'butt'; // reset
  vectorGlow(null);
  ctx.restore();
}

// ================================================================
// FLAG — Moon prop  (SPEC-09 §6)
// ================================================================
function drawFlag(px, py, unfurl) {
  // px, py = plant position at ground level (foot of pole)
  const poleH = 18;

  // Pole
  vectorGlow('rgba(200,220,255,0.9)', 8);
  ctx.strokeStyle = SHIP_COLOUR;
  ctx.lineWidth   = 1.6;
  ctx.beginPath();
  ctx.moveTo(px, py - 2);
  ctx.lineTo(px, py - 2 - poleH);
  ctx.stroke();

  if (unfurl > 0) {
    const fw = Math.round(11 * unfurl);
    const fh = 7;
    const fy = py - 2 - poleH;

    // Flag outline + stripe
    ctx.strokeRect(px, fy, fw, fh);
    if (fw > 2) {
      ctx.beginPath(); ctx.moveTo(px, fy + 3.5); ctx.lineTo(px + fw, fy + 3.5); ctx.stroke();
    }
  }
  vectorGlow(null);
}

// ================================================================
// SUCCESS ANIMATION — MASTER RENDER
// ================================================================
function drawSuccessAnimation(now) {
  if (!anim) return;

  const settleOff = anim.settleY || 0;

  // ---- World space (camera transform applied) ----
  ctx.save();
  // Zoom centred on the landing spot
  const zoom = anim.zoom;
  ctx.translate(anim.landX, anim.padY);
  ctx.scale(zoom, zoom);
  ctx.translate(-anim.landX, -anim.padY);

  drawParticles();   // before terrain, so below-ground dust is hidden
  drawTerrain();
  drawPads(now);
  drawDebris();
  drawUFO();
  drawShip(settleOff);

  // Astronaut — not visible during SETTLE or HATCH_OPEN
  const ph = PHASES[anim.phase] ? PHASES[anim.phase].name : '';
  if (anim.astVisible && ph !== 'SETTLE' && ph !== 'HATCH_OPEN') {
    drawAstronaut(anim.astX, anim.astFootY, anim.armState);
  }

  // Flag — visible once PLANT starts
  if (anim.flagUnfurl > 0) {
    drawFlag(anim.landX + PLANT_OFFSET, anim.padY, anim.flagUnfurl);
  }

  ctx.restore();
  // ---- Screen space ----

  // Letterbox bars  (SPEC-09 §4.2)
  const lbH = LETTERBOX_H * anim.letterbox;
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0,        CW, lbH);
  ctx.fillRect(0, CH - lbH, CW, lbH);

  // Fade to black during FADE phase  (SPEC-09 §3)
  if (anim.fadeAlpha > 0) {
    ctx.fillStyle = `rgba(0,0,0,${anim.fadeAlpha})`;
    ctx.fillRect(0, 0, CW, CH);
  }

  // Skip hint — bottom-right, appears after 1 s (SPEC-09 §8, SPEC-11 §3.9)
  if (anim.skipHinted && anim.fadeAlpha < 0.5) {
    const hintAlpha = Math.min(1, (anim.totalElapsed - 1.0) / 0.3) * (1 - anim.fadeAlpha * 2);
    ctx.textAlign = 'right';
    ctx.font      = '11px monospace';
    ctx.fillStyle = `rgba(88,88,88,${hintAlpha})`;
    ctx.fillText('Space / Esc to skip', CW - 16, CH - lbH - 14);
    ctx.textAlign = 'left';
  }
}

// ================================================================
// HUD  (SPEC-11 §3)
// ================================================================
function drawHUD(now) {
  const pct = ship.fuel / ship.maxFuel;

  const bx = 16, by = 24, bw = 160, bh = 14;
  ctx.font = '10px monospace'; ctx.fillStyle = level.terrainEdgeColour; ctx.textAlign = 'left';
  ctx.fillText('FUEL', bx, by - 5);

  ctx.fillStyle = '#000000';
  ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = level.terrainEdgeColour; ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, bw, bh);

  let fcol = '#00FF88';
  if      (pct < 0.25) fcol = (Math.floor(now * 4) % 2 === 0) ? '#FF4444' : null;
  else if (pct < 0.5)  fcol = '#FFB800';
  if (fcol) { ctx.fillStyle = fcol; ctx.fillRect(bx + 2, by + 2, (bw - 4) * pct, bh - 4); }

  ctx.font = '12px monospace'; ctx.fillStyle = '#FFFFFF';
  ctx.fillText(Math.floor(ship.fuel), bx + bw + 8, by + 11);

  const vyAbs  = Math.abs(ship.vy);
  const vxAbs  = Math.abs(ship.vx);
  const vyWarn = ship.vy > level.maxDescentSpeed * 0.8;
  const vxWarn = vxAbs   > level.maxLateralSpeed  * 0.8;
  const vyDir  = ship.vy >= 0 ? '↓' : '↑';
  const vxDir  = ship.vx >= 0 ? '→' : '←';

  ctx.font = '11px monospace';
  ctx.fillStyle = level.terrainEdgeColour; ctx.fillText('VERT ', bx, by + 30);
  ctx.fillStyle = vyWarn ? '#FF4444' : '#CCCCCC';
  ctx.fillText(`${vyDir}${(vyAbs / PPM).toFixed(1)} m/s`, bx + 40, by + 30);

  ctx.fillStyle = level.terrainEdgeColour; ctx.fillText('HORIZ', bx, by + 45);
  ctx.fillStyle = vxWarn ? '#FF4444' : '#CCCCCC';
  ctx.fillText(`${vxDir}${(vxAbs / PPM).toFixed(1)} m/s`, bx + 40, by + 45);

  const botY   = ship.y + LANDER.height / 2;
  const altPx  = Math.max(0, terrainY(ship.x) - botY);
  const altWarn = altPx < 60 * PPM;
  ctx.fillStyle = level.terrainEdgeColour; ctx.fillText('ALT  ', bx, by + 60);
  ctx.fillStyle = altWarn ? '#FFB800' : '#CCCCCC';
  ctx.fillText(`${(altPx / PPM).toFixed(1)} m`, bx + 40, by + 60);

  const na = Math.abs(normAngle(ship.angle));
  ctx.fillStyle = level.terrainEdgeColour; ctx.fillText('TILT ', bx, by + 75);
  ctx.fillStyle = na > 4 ? '#FF4444' : '#CCCCCC';
  ctx.fillText(na < 1 ? 'OK' : `${na.toFixed(1)}°`, bx + 40, by + 75);

  // Gust warning — amber blink at 1.67 Hz (SPEC-07 §3.3)
  if (gustWarning && Math.floor(now * 1000 % 600) < 300) {
    ctx.font      = '11px monospace';
    ctx.fillStyle = '#FFB800';
    ctx.textAlign = 'left';
    ctx.fillText('⚠ WIND GUST', bx, by + 95);
  }

  // Wind direction indicator  (SPEC-11 §3.7) — centred, below level banner
  if (level.wind !== 0) {
    const wms    = Math.abs(level.wind);
    const str    = wms < 1.0 ? 'LOW' : wms < 2.0 ? 'MED' : 'HIGH';
    const arrow  = level.wind > 0 ? '→' : '←';
    ctx.textAlign = 'center'; ctx.font = '12px monospace'; ctx.fillStyle = '#88AACC';
    ctx.fillText(`${arrow} WIND ${str}`, CW / 2, 50);
    ctx.textAlign = 'left';
  }

  if (bannerTimer < 3.5) {
    let alpha;
    if      (bannerTimer < 0.3) alpha = bannerTimer / 0.3;
    else if (bannerTimer < 3.0) alpha = 1.0;
    else                        alpha = 1.0 - (bannerTimer - 3.0) / 0.5;
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.textAlign = 'center'; ctx.font = '15px monospace'; ctx.fillStyle = '#FFFFFF';
    ctx.fillText(`LEVEL ${level.id} — ${level.name.toUpperCase()}`, CW / 2, 22);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'left';
}

// ================================================================
// OVERLAY SCREENS
// ================================================================
function drawCrashMsg() {
  if (crashAlpha <= 0 || !crashMsg) return;
  ctx.textAlign = 'center'; ctx.font = 'bold 30px monospace';
  ctx.fillStyle = `rgba(255,68,68,${crashAlpha})`;
  ctx.fillText(crashMsg, CW / 2, CH / 2 - 20);
  ctx.textAlign = 'left';
}

function drawPaused() {
  ctx.fillStyle = 'rgba(0,0,0,0.62)';
  ctx.fillRect(0, 0, CW, CH);
  ctx.textAlign = 'center';

  ctx.font = 'bold 30px monospace'; ctx.fillStyle = '#FFFFFF';
  ctx.fillText('PAUSED', CW / 2, CH / 2 - 90);

  const items = ['RESUME', 'RESTART LEVEL', 'LEVEL SELECT', 'MAIN MENU'];
  const _pauseActions = [
    () => { gState = 'FLYING'; },
    () => { initShip(); gState = 'FLYING'; },
    () => { gState = 'LEVEL_SELECT'; menuSel = 0; },
    () => { gState = 'MAIN_MENU';    menuSel = 0; },
  ];
  _hitboxes = [];
  items.forEach((item, i) => {
    const y   = CH / 2 - 30 + i * 38;
    const sel = i === menuSel;
    if (sel) {
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fillRect(CW / 2 - 150, y - 24, 300, 32);
    }
    ctx.font      = sel ? 'bold 18px monospace' : '18px monospace';
    ctx.fillStyle = sel ? '#FFFFFF' : '#999999';
    ctx.fillText((sel ? '▶  ' : '   ') + item, CW / 2, y);
    const action = _pauseActions[i];
    _hitboxes.push({ x: CW / 2 - 200, y: y - 30, w: 400, h: 38, action: () => { menuSel = i; action(); } });
  });

  ctx.font = '11px monospace'; ctx.fillStyle = '#333333';
  if (!isMobile) ctx.fillText('↑ ↓  navigate   Enter  select   Esc  resume', CW / 2, CH - 28);
  ctx.textAlign = 'left';
}

// Results screen  (SPEC-11 §7, SPEC-10 §4)
// Options on the level-complete screen, shared by keyboard and click/touch
function resultsItems() {
  const items = [];
  if (level.id < LEVELS.length) items.push({ label: 'NEXT LEVEL', action: () => {
    level = LEVELS[level.id];  // level.id is 1-based; LEVELS[level.id] = next level
    _debrisSnap = (level.debris || []).map(d => d.x);
    initShip();
    fadeTransition(0.3, () => { gState = 'FLYING'; });
  }});
  items.push(
    { label: 'RETRY',        action: () => { initShip(); gState = 'FLYING'; } },
    { label: 'LEVEL SELECT', action: () => { gState = 'LEVEL_SELECT'; menuSel = level.id - 1; } },
    { label: 'MAIN MENU',    action: () => { gState = 'MAIN_MENU';    menuSel = 0; } },
  );
  return items;
}

function drawResults() {
  if (!resultsData) return;
  const { snap, stars } = resultsData;
  const bestFuel = savedFuel(level.id);
  const isNewBest = snap.fuelPct > bestFuel + 0.005;

  ctx.fillStyle = 'rgba(0,0,0,0.80)';
  ctx.fillRect(0, 0, CW, CH);
  ctx.textAlign = 'center';

  ctx.font = '14px monospace'; ctx.fillStyle = '#666666';
  ctx.fillText(`LEVEL ${level.id} — ${level.name.toUpperCase()}`, CW / 2, CH / 2 - 148);

  ctx.font = 'bold 36px monospace'; ctx.fillStyle = '#FFFFFF';
  ctx.fillText('COMPLETE', CW / 2, CH / 2 - 106);

  const starRow = '★'.repeat(stars) + '☆'.repeat(3 - stars);
  ctx.font = '36px sans-serif'; ctx.fillStyle = '#FFB800';
  ctx.fillText(starRow, CW / 2, CH / 2 - 58);

  ctx.font = '14px monospace'; ctx.fillStyle = '#AAAAAA';
  ctx.fillText(`Fuel remaining    ${Math.round(snap.fuelPct * 100)}%`,    CW / 2, CH / 2 - 4);
  ctx.fillText(`Landing speed     ${(snap.vy / PPM).toFixed(1)} m/s`,    CW / 2, CH / 2 + 20);
  ctx.fillText(`Angle             ${snap.angle.toFixed(1)}°`,             CW / 2, CH / 2 + 44);

  if (isNewBest) {
    ctx.font = '11px monospace'; ctx.fillStyle = '#FFB800';
    ctx.fillText('★ NEW BEST FUEL', CW / 2, CH / 2 + 66);
  }

  const hasNext = level.id < LEVELS.length;
  const items   = resultsItems();
  const firstItemY = CH / 2 + (hasNext ? 94 : 110);
  _hitboxes = [];
  items.forEach((item, i) => {
    const y   = firstItemY + i * 38;
    const sel = i === menuSel;
    const colour = sel ? (i === 0 && hasNext ? '#00FF88' : '#FFFFFF') : '#999999';
    ctx.font      = sel ? 'bold 18px monospace' : '17px monospace';
    ctx.fillStyle = colour;
    ctx.fillText((sel ? '▶  ' : '   ') + item.label, CW / 2, y);
    _hitboxes.push({ x: CW / 2 - 200, y: y - 28, w: 400, h: 38, action: () => { menuSel = i; item.action(); } });
  });

  ctx.font = '11px monospace'; ctx.fillStyle = '#333333';
  if (!isMobile) ctx.fillText('↑ ↓  navigate   Enter  select   R  retry', CW / 2, CH - 28);
  ctx.textAlign = 'left';
}

// Pop-up panel over the level after MAX_CRASHES consecutive crashes
function drawMissionFailed() {
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, CW, CH);
  const pw = 440, ph = 270, px = (CW - pw) / 2, py = (CH - ph) / 2 - 10;
  ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(px, py, pw, ph);
  vectorGlow('#FF4040', 10);
  ctx.strokeStyle = '#FF4040'; ctx.lineWidth = 2; ctx.strokeRect(px, py, pw, ph);
  vectorGlow(null);
  ctx.textAlign = 'center';

  ctx.font = 'bold 36px monospace'; ctx.fillStyle = '#FF4444';
  ctx.fillText('MISSION FAILED', CW / 2, CH / 2 - 80);

  ctx.font = '15px monospace'; ctx.fillStyle = '#999999';
  ctx.fillText(`${MAX_CRASHES} crashes in a row on this level`, CW / 2, CH / 2 - 48);

  const items = ['TRY AGAIN', 'LEVEL SELECT', 'MAIN MENU'];
  const _goActions = [
    () => { restart(); },
    () => { gState = 'LEVEL_SELECT'; menuSel = level.id - 1; },
    () => { gState = 'MAIN_MENU';    menuSel = 0; },
  ];
  _hitboxes = [];
  items.forEach((item, i) => {
    const y   = CH / 2 + 10 + i * 38;
    const sel = i === menuSel;
    ctx.font      = sel ? 'bold 18px monospace' : '18px monospace';
    ctx.fillStyle = sel ? '#FFFFFF' : '#999999';
    ctx.fillText((sel ? '▶  ' : '   ') + item, CW / 2, y);
    const action = _goActions[i];
    _hitboxes.push({ x: CW / 2 - 200, y: y - 30, w: 400, h: 38, action: () => { menuSel = i; action(); } });
  });

  ctx.font = '11px monospace'; ctx.fillStyle = '#333333';
  if (!isMobile) ctx.fillText('↑ ↓  navigate   Enter  select   R  try again', CW / 2, CH - 28);
  ctx.textAlign = 'left';
}

function drawMainMenu() {

  ctx.font = 'bold 54px monospace'; ctx.fillStyle = '#FFFFFF';
  ctx.fillText('LUNAR LANDER', CW / 2, 172);

  ctx.font = '15px monospace'; ctx.fillStyle = '#555555';
  ctx.fillText('Land softly.  Land precisely.', CW / 2, 210);

  const ts = totalSavedStars(), ms = maxStars();
  ctx.font = '13px monospace'; ctx.fillStyle = '#FFB800';
  ctx.fillText(`★  ${ts} / ${ms}`, CW / 2, 240);

  const items = ['PLAY', 'LEVEL SELECT', 'HOW TO PLAY', 'CREDITS'];
  const _mainActions = [
    () => { initShip(); fadeTransition(0.3, () => { gState = 'FLYING'; }); },
    () => { gState = 'LEVEL_SELECT'; menuSel = 0; },
    () => { gState = 'HOW_TO_PLAY';  menuSel = 0; },
    () => { gState = 'HOW_TO_PLAY';  menuSel = 0; },

  _hitboxes = [];
  items.forEach((item, i) => {
    const y   = 322 + i * 52;
    const sel = i === menuSel;
    if (sel) {
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fillRect(CW / 2 - 160, y - 28, 320, 36);
    }
    ctx.font      = sel ? 'bold 22px monospace' : '20px monospace';
    ctx.fillStyle = sel ? '#FFFFFF' : '#999999';
    ctx.fillText((sel ? '▶  ' : '   ') + item, CW / 2, y);
    const action = _mainActions[i];
    _hitboxes.push({ x: CW / 2 - 200, y: y - 38, w: 400, h: 52, action: () => { menuSel = i; action(); } });
  });

  drawMobileCornerBtn('⛶', toggleFullscreen);

  ctx.font = '11px monospace'; ctx.fillStyle = '#2A2A2A';
  if (!isMobile) ctx.fillText('↑ ↓  navigate   Enter / Space  select', CW / 2, CH - 26);
  ctx.textAlign = 'left';
}

// Environment accent colours for level cells
const ENV_COL = { MOON: '#C8C8C8', MARS: '#C84820', TITAN: '#A8C8E0', IO: '#D8C040' };

function drawLevelSelect() {
  ctx.fillStyle = 'rgba(0,0,0,0.90)';
  ctx.fillRect(0, 0, CW, CH);
  ctx.textAlign = 'center';

  ctx.font = 'bold 22px monospace'; ctx.fillStyle = '#FFFFFF';
  ctx.fillText('SELECT LEVEL', CW / 2, 52);

  ctx.font = '13px monospace'; ctx.fillStyle = '#FFB800';
  ctx.fillText(`★  ${totalSavedStars()} / ${maxStars()}`, CW / 2, 78);

  const cols = 4, cw = 192, ch = 88, gap = 10;   // one row per planet
  const gx   = (CW - (cols * cw + (cols - 1) * gap)) / 2;
  const gy   = 106;

  _hitboxes = [{ x: 0, y: CH - 50, w: CW, h: 50, action: () => { gState = 'MAIN_MENU'; menuSel = 0; } }];

  for (let i = 0; i < LEVELS.length; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    const cx  = gx + col * (cw + gap);
    const cy  = gy + row * (ch + gap);
    const lev = LEVELS[i];
    const sel = i === menuSel;

    ctx.fillStyle   = sel ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.04)';
    ctx.fillRect(cx, cy, cw, ch);
    ctx.strokeStyle = sel ? '#FFFFFF' : 'rgba(255,255,255,0.2)';
    ctx.lineWidth   = sel ? 2 : 1;
    ctx.strokeRect(cx, cy, cw, ch);

    if (lev) {
      ctx.textAlign = 'left'; ctx.font = '10px monospace'; ctx.fillStyle = '#888888';
      ctx.fillText(String(lev.id), cx + 8, cy + 16);

      ctx.textAlign = 'center';
      ctx.font = 'bold 11px monospace';
      ctx.fillStyle = ENV_COL[lev.environment] || '#888888';
      ctx.fillText(lev.name.toUpperCase(), cx + cw / 2, cy + 38);

      const stars = savedStars(lev.id);
      ctx.font = '22px sans-serif'; ctx.fillStyle = '#FFB800';
      ctx.fillText('★'.repeat(stars) + '☆'.repeat(3 - stars), cx + cw / 2, cy + 70);

      _hitboxes.push({ x: cx, y: cy, w: cw, h: ch, action: () => {
        menuSel = i;
        level = lev;
        _debrisSnap = (level.debris || []).map(d => d.x);
        initShip();
        fadeTransition(0.3, () => { gState = 'FLYING'; });
      }});
    }
  }

  ctx.textAlign = 'center'; ctx.font = '11px monospace'; ctx.fillStyle = '#2A2A2A';
  if (!isMobile) ctx.fillText('↑ ↓ ← →  navigate   Enter  start   Esc  back', CW / 2, CH - 26);
  ctx.textAlign = 'left';
}

function drawHowToPlay() {
  _hitboxes = [{ x: 0, y: 0, w: CW, h: CH, action: () => { gState = 'MAIN_MENU'; menuSel = 0; } }];
  ctx.fillStyle = 'rgba(0,0,0,0.92)';
  ctx.fillRect(0, 0, CW, CH);

  const lx = 180, col2 = 380;
  let y = 62;

  ctx.textAlign = 'center'; ctx.font = 'bold 22px monospace'; ctx.fillStyle = '#FFFFFF';
  ctx.fillText('HOW TO PLAY', CW / 2, y); y += 46;

  function section(title) {
    ctx.textAlign = 'left'; ctx.font = 'bold 12px monospace'; ctx.fillStyle = '#555555';
    ctx.fillText(title, lx, y); y += 22;
  }
  function row(left, right, leftCol = '#CCCCCC', rightCol = '#666666') {
    ctx.textAlign = 'left'; ctx.font = '13px monospace';
    ctx.fillStyle = leftCol;  ctx.fillText(left,  lx + 14, y);
    ctx.fillStyle = rightCol; ctx.fillText(right, col2,     y);
    y += 22;
  }

  section('CONTROLS');
  row('↑ / W / Space',  'Thrust');
  row('← → / A  D',    'Rotate');
  row('P / Esc',        'Pause');
  row('R',              'Restart  (Game Over)');
  y += 10;

  section('LANDING CRITERIA');
  const crit = [
    'Vertical speed at or below limit',
    'Horizontal speed at or below limit',
    'Tilt angle ≤ ±5°',
    'Both legs on the landing pad',
  ];
  crit.forEach(c => {
    ctx.textAlign = 'left'; ctx.font = '13px monospace';
    ctx.fillStyle = '#00FF88'; ctx.fillText('✓', lx + 14, y);
    ctx.fillStyle = '#888888'; ctx.fillText(c, lx + 32,   y);
    y += 22;
  });
  y += 10;

  section('STAR RATINGS');
  [
    ['★★★', 'Fuel >65%,  ↓Speed <30%,  Angle <2°'],
    ['★★ ', 'Fuel >40%,  ↓Speed <60%'],
    ['★  ', 'Any safe landing'],
  ].forEach(([s, d]) => {
    ctx.textAlign = 'left';
    ctx.font = '16px sans-serif'; ctx.fillStyle = '#FFB800'; ctx.fillText(s,  lx + 14, y);
    ctx.font = '13px monospace';  ctx.fillStyle = '#888888'; ctx.fillText(d,  lx + 64, y);
    y += 22;
  });
  y += 10;

  section('HAZARDS  (Level 4+)');
  [
    ['WIND',   'Pushes your craft sideways'],
    ['DEBRIS', 'Instant crash on contact'],
    ['UFO',    'Drains 25% fuel  (Levels 7–12)'],
  ].forEach(([h, d]) => {
    ctx.textAlign = 'left'; ctx.font = '13px monospace';
    ctx.fillStyle = '#FFB800'; ctx.fillText(h, lx + 14, y);
    ctx.fillStyle = '#888888'; ctx.fillText(d, lx + 92, y);
    y += 22;
  });

  ctx.textAlign = 'center'; ctx.font = '11px monospace'; ctx.fillStyle = '#2A2A2A';
  ctx.fillText('Esc / Enter / Space  to return', CW / 2, CH - 26);
  ctx.textAlign = 'left';
}

// Full-screen fade overlay — drawn last, on top of everything  (SPEC-11 §10)
function drawFade() {
  if (fade.alpha <= 0) return;
  ctx.fillStyle = `rgba(0,0,0,${fade.alpha})`;
  ctx.fillRect(0, 0, CW, CH);
}

// ================================================================
// UFO  (SPEC-08)
// ================================================================

function spawnUFO() {
  ufo.orbitAngle   = Math.random() * Math.PI * 2;
  ufo.driftPhase   = Math.random() * Math.PI * 2;
  ufo.orbitCentreX = ship.x;
  ufo.orbitCentreY = ship.y - 80;
  ufo.orbitSpeed   = level.ufoOrbitSpeed || 0.4;
  ufo.baseRadius   = UFO_BASE_RADIUS;
  ufo.x            = ufo.orbitCentreX + Math.cos(ufo.orbitAngle) * ufo.baseRadius;
  ufo.y            = ufo.orbitCentreY;
  ufo.glowPhase    = 0;
  ufo.trail        = [];
  ufo.active       = true;
  ufo.collisionFlash = false;
}

function resetUFO() {
  ufo.active         = false;
  ufo.trail          = [];
  ufo.collisionFlash = false;
  ufoCollisionCooldown = 0;
  if (level.ufoEnabled) spawnUFO();
}

// Drain 18.75% of current fuel on UFO contact (SPEC-08 §5.2, SPEC-03 §5)
// Original 25% reduced by 25% after playtesting found it too severe.
function applyUFOFuelDrain() {
  ship.fuel = Math.max(0, ship.fuel * 0.8125);
}

function updateUFO(dt) {
  if (!ufo.active) return;

  // Advance orbit and drift
  ufo.orbitAngle += ufo.orbitSpeed * dt;
  ufo.driftPhase += UFO_DRIFT_SPEED * dt;
  ufo.glowPhase  += UFO_GLOW_SPEED * Math.PI * 2 * dt;

  // Lag-track the lander  (SPEC-08 §4.1 — lerp factor 0.02)
  ufo.orbitCentreX = lerp(ufo.orbitCentreX, ship.x,      0.02);
  ufo.orbitCentreY = lerp(ufo.orbitCentreY, ship.y - 80, 0.02);

  // Primary orbit (elliptical: vertical scale 0.5)
  const ox = ufo.orbitCentreX + Math.cos(ufo.orbitAngle) * ufo.baseRadius;
  const oy = ufo.orbitCentreY + Math.sin(ufo.orbitAngle) * ufo.baseRadius * 0.5;

  // Secondary drift  (SPEC-08 §4.1)
  const dx = Math.sin(ufo.driftPhase * 1.3) * 40;
  const dy = Math.cos(ufo.driftPhase * 0.9) * 25;

  // Save last position to trail before moving
  ufo.trail.unshift({ x: ufo.x, y: ufo.y });
  if (ufo.trail.length > UFO_TRAIL_LENGTH) ufo.trail.length = UFO_TRAIL_LENGTH;

  // Apply position + airspace clamp  (SPEC-08 §4.3)
  ufo.x = ox + dx;
  ufo.y = Math.max(UFO_MIN_Y, Math.min(UFO_MAX_Y, oy + dy));

  // Tick collision cooldown
  if (ufoCollisionCooldown > 0) ufoCollisionCooldown -= dt;
}

function checkUFOCollision() {
  if (!ufo.active || ufoCollisionCooldown > 0) return;

  const lx = ship.x - LANDER.width  / 2;
  const rx = ship.x + LANDER.width  / 2;
  const ty = ship.y - LANDER.height / 2;
  const by = ship.y + LANDER.height / 2;

  const ux  = ufo.x - UFO_W / 2;
  const urx = ufo.x + UFO_W / 2;
  const uty = ufo.y - UFO_H / 2;
  const uby = ufo.y + UFO_H / 2;

  if (rx > ux && lx < urx && by > uty && ty < uby) {
    applyUFOFuelDrain();
    ufo.collisionFlash   = true;
    ufoCollisionCooldown = UFO_COLLISION_COOLDOWN;
    setTimeout(() => { ufo.collisionFlash = false; }, 300);
  }
}

function drawUFO() {
  if (!ufo.active) return;

  // Trail  (SPEC-08 §6.2)
  ufo.trail.forEach((pos, i) => {
    const a = (1 - i / ufo.trail.length) * 0.4;
    const r = 1.5 - (i / ufo.trail.length);
    ctx.fillStyle = `rgba(122,184,255,${a})`;
    ctx.fillRect(pos.x - r / 2, pos.y - r / 2, r, r);
  });

  ctx.save();
  ctx.translate(ufo.x, ufo.y);
  ctx.scale(0.5, 0.5);   // drawn at half size to match UFO_W / UFO_H

  // Asteroids-style saucer outline; glow pulses (SPEC-08 §6.1)
  // Collision flash turns it white (SPEC-08 §6.3)
  const col = ufo.collisionFlash ? '#FFFFFF' : '#7AB8FF';
  vectorGlow(col, 10 + Math.sin(ufo.glowPhase) * 6);
  ctx.strokeStyle = col; ctx.lineWidth = 3.2; ctx.lineJoin = 'round';   // 1.6px on screen
  ctx.beginPath();
  ctx.moveTo(-24, 2); ctx.lineTo(-10, -4); ctx.lineTo(10, -4); ctx.lineTo(24, 2);
  ctx.lineTo(10, 9);  ctx.lineTo(-10, 9);  ctx.closePath();
  ctx.moveTo(-24, 2); ctx.lineTo(24, 2);
  ctx.moveTo(-10, -4); ctx.lineTo(-6, -11); ctx.lineTo(6, -11); ctx.lineTo(10, -4);
  ctx.stroke();
  vectorGlow(null);

  ctx.restore();
}

// ================================================================
// HAZARDS  (SPEC-07)
// ================================================================

// Move drifting debris pieces in ping-pong oscillation (SPEC-07 §5.2)
function updateDebris(dt) {
  if (!level.debris || level.debris.length === 0) return;
  for (const d of level.debris) {
    if (!d.drifts) continue;
    d.x += d.driftDir * d.driftSpeed * dt;
    if (d.x >= d.driftMax) { d.x = d.driftMax; d.driftDir = -1; }
    if (d.x <= d.driftMin) { d.x = d.driftMin; d.driftDir =  1; }
  }
}

// Debris shapes (SPEC-07 §5.4): rock = pentagon, boulder = ellipse
function drawDebris() {
  if (!level.debris || level.debris.length === 0) return;
  for (const d of level.debris) {
    ctx.save();
    ctx.translate(d.x + d.w / 2, d.y + d.h / 2);
    const col = d.colour || '#888888';
    vectorGlow(col, 8);
    ctx.strokeStyle = col;
    ctx.lineWidth   = 1.6;
    ctx.beginPath();
    const hw = d.w / 2, hh = d.h / 2;
    if (d.type === 'rock') {
      ctx.moveTo(  0,       -hh      );
      ctx.lineTo(  hw,      -hh*0.3  );
      ctx.lineTo(  hw*0.7,   hh      );
      ctx.lineTo( -hw*0.5,   hh      );
      ctx.lineTo( -hw,       hh*0.1  );
    } else { // boulder
      ctx.ellipse(0, 0, hw, hh, 0, 0, Math.PI * 2);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }
}

// ================================================================
// GAME LOOP
// ================================================================
let lastT = null;

function loop(t) {
  if (!lastT) lastT = t;
  const dt  = Math.min((t - lastT) / 1000, MAX_DT);
  lastT = t;
  const now = t / 1000;

  // ---- Update ----
  if (gState === 'FLYING') {
    updatePhysics(dt);
    updateDebris(dt);
    updateUFO(dt);
    checkUFOCollision();
    bannerTimer += dt;
  }
  if (gState === 'FLYING') updateWarnings(dt);
  else                     shipWarn = null;
  updateAudio(dt);

  if (gState === 'SUCCESS_ANIMATION') updateUFO(dt);  // UFO orbits during Titan animation

  if (gState === 'CRASHED') {
    crashTimer += dt;
    crashAlpha  = Math.max(0, 1 - crashTimer / 1.5);
    if (crashTimer >= 1.5) {
      crashStreak++;
      if (crashStreak >= MAX_CRASHES) { gState = 'MISSION_FAILED'; menuSel = 0; }
      else                            { initShip(true); gState = 'FLYING'; }
    }
  }

  // Screen fade transition  (SPEC-11 §10)
  if (fade.dir !== 0) {
    fade.alpha = clamp(fade.alpha + fade.dir * fade.speed * dt, 0, 1);
    if (fade.dir > 0 && fade.alpha >= 1) {
      fade.dir = 0;
      if (fade.cb) { const cb = fade.cb; fade.cb = null; cb(); }
    } else if (fade.dir < 0 && fade.alpha <= 0) {
      fade.alpha = 0; fade.dir = 0;
    }
  }

  if (gState === 'SUCCESS_ANIMATION') updateAnimation(dt);

  updateParticles(dt);

  // ---- Draw ----
  drawBackground();

  if (gState === 'SUCCESS_ANIMATION') {
    // World rendered inside drawSuccessAnimation with camera transform
    drawSuccessAnimation(now);
  } else if (gState !== 'MAIN_MENU' && gState !== 'LEVEL_SELECT' && gState !== 'HOW_TO_PLAY') {
    // Normal world render (no camera transform) — skip for full-screen menu states
    // Particles go first so the terrain's black fill hides anything below ground
    drawParticles();
    drawTerrain();
    drawPads(now);
    drawDebris();
    drawUFO();
    drawShip();
  }

  if (gState === 'FLYING' || gState === 'CRASHED') _hitboxes = [];
  if (gState === 'SUCCESS_ANIMATION') _hitboxes = [{ x: 0, y: 0, w: CW, h: CH, action: skipAnimation }];
  if (gState === 'FLYING' || gState === 'PAUSED') drawHUD(now);
  if (gState === 'FLYING') drawTouchButtons();
  if (gState === 'FLYING') drawMobileCornerBtn('⏸', () => { gState = 'PAUSED'; menuSel = 0; clearFlight(); });
  if (gState === 'CRASHED')      drawCrashMsg();
  if (gState === 'PAUSED')       drawPaused();
  if (gState === 'RESULTS')      { drawTerrain(); drawPads(now); drawDebris(); drawUFO(); drawShip(); drawResults(); }
  if (gState === 'MISSION_FAILED') drawMissionFailed();
  if (gState === 'MAIN_MENU')    drawMainMenu();
  if (gState === 'LEVEL_SELECT') drawLevelSelect();
  if (gState === 'HOW_TO_PLAY')  drawHowToPlay();

  drawToast(now);
  drawFade();  // always on top — handles transition overlays

  requestAnimationFrame(loop);
}

// ================================================================
// START
// ================================================================
initBgStars();
initShip();
requestAnimationFrame(loop);
</script>
